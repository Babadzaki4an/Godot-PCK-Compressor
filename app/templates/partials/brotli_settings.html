<div id="brotli-settings" class="tab-settings">
    <h3>Brotli</h3>
    <div class="form-group">
        <label>
            <input type="checkbox" id="brotli-createBackup" checked> <span data-i18n="gzip_create_backups">Создавать бэкапы (.backup) перед изменениями</span>
        </label>
    </div>
    <div class="form-group" style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div>
            <label for="brotli-wasmLevel" data-i18n="brotli_wasm_level">Сжатие WASM (0-11):</label>
            <input type="number" id="brotli-wasmLevel" class="text-input" min="0" max="11" value="11" style="width: 70px;">
        </div>
        <div>
            <label for="brotli-pckLevel" data-i18n="brotli_pck_level">Сжатие PCK (0-11):</label>
            <input type="number" id="brotli-pckLevel" class="text-input" min="0" max="11" value="11" style="width: 70px;">
        </div>
    </div>
</div>
