<link rel="stylesheet" href="/static/css/pages/compress.css">
<h1 data-i18n="compress_title">Сжатие билда</h1>
<div class="compress-form">
    <!-- Поле выбора папки -->
    <div class="form-group">
        <label for="folderPath" data-i18n="compress_select_folder">Выберите папку с билдом:</label>
        <div class="folder-selector">
            <input type="text" id="folderPath" data-persist placeholder="C:/path/to/build" class="text-input">
            <button id="selectFolderBtn" class="button second-button"><i class="fas fa-folder-open"></i> <span data-i18n="compress_select_folder_short">Выбрать</span></button>
        </div>
    </div>

    <!-- Имя HTML-файла -->
    <div class="form-group">
                <label for="htmlFileName" data-i18n="compress_html_name">Имя HTML-файла:</label>
        <div class="folder-selector">
            <input type="text" id="htmlFileName" data-persist value="index" placeholder="{{ _('compress_html_placeholder') }}" class="text-input">
            <button id="selectHtmlBtn" class="button second-button"><i class="fas fa-file-code"></i> <span data-i18n="compress_select_html_short">Выбрать HTML</span></button>
        </div>
    </div>

    <!-- Блок статуса файлов -->
    <div class="file-status" id="fileStatus">
                <label data-i18n="compress_project_composition">Состав проекта:</label>
        <div class="status-row">
            <div class="status-item" id="status-js">
                <i class="fas fa-circle"></i> <span>JS</span>
            </div>
            <div class="status-item" id="status-wasm">
                <i class="fas fa-circle"></i> <span>WASM</span>
            </div>
            <div class="status-item" id="status-pck">
                <i class="fas fa-circle"></i> <span>PCK</span>
            </div>
            <div class="status-item" id="status-html">
                <i class="fas fa-circle"></i> <span>HTML</span>
            </div>
        </div>
    </div>

    <!-- Блок выбора сжатия -->
    <div class="collapsible-block compression-block">
        <div class="collapsible-header compression-header">
            <div class="flex-row">
                <label for="compressionSelect" data-i18n="compress_type">Тип сжатия:</label>
                <select id="compressionSelect" class="text-input select-compact">
                    <option value="gzip">Gzip</option>
                    <option value="brotli">Brotli</option>
                </select>
            </div>
            <button id="toggleCompressionBlock" class="toggle-btn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div id="compressionContent" class="collapsible-content open">
            <div id="gzip-settings" class="tab-settings">
                {% include "partials/gzip_settings.html" %}
            </div>
            <div id="brotli-settings" class="tab-settings" style="display: none;">
                {% include "partials/brotli_settings.html" %}
            </div>
        </div>
    </div>

    <!-- Платформа -->
    <div class="platform-block">
        <label for="platformSelect" data-i18n="compress_platform">Платформа:</label>
        <select id="platformSelect" class="text-input">
            <option value="" data-i18n="compress_loading">Загрузка...</option>
        </select>
    </div>

    <!-- Блок исключения расширений -->
    <div class="collapsible-block exclude-extensions">
        <div class="collapsible-header exclude-header">
            <label>
                <input type="checkbox" id="excludeEnabled" checked> 
                <span data-i18n="compress_zip_archive">Упаковать в архив</span>
            </label>
            <button id="toggleExcludeBlock" class="toggle-btn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div id="excludeContent" class="collapsible-content open">
            <p class="hint-text" data-i18n="compress_exclude_hint">Расширения файлов, которые не попадут в архив (исключения):</p>
            <div class="extension-input-group">
                <input type="text" id="excludeExtensionInput" placeholder=".backup">
                <button id="addExtensionBtn" class="button second-button button-compact" data-i18n="compress_add">Добавить</button>
            </div>
            <ul id="extensionList" class="extension-list"></ul>
            <button id="removeSelectedExtensionsBtn" class="button danger-button button-compact" data-i18n="compress_remove_selected">Удалить выбранное</button>
        </div>
    </div>

    <!-- Кнопка запуска -->
    <div class="form-group">
        <button id="startCompressBtn" class="button primary-button">
            <i class="fas fa-play"></i> <span id="compressBtnLabel" data-i18n="compress_start">Запустить сжатие</span>
            <i class="fas fa-spinner fa-spin btn-spinner" id="compressSpinner" style="display: none;"></i>
        </button>
        <button id="openFolderBtn" class="button second-button"><i class="fas fa-folder-open"></i> <span data-i18n="compress_open_folder">Открыть</span></button>
    </div>

    <!-- Прогресс и статус -->
    <div class="progress-container">
        <label data-i18n="compress_progress">{{ _("compress_progress") }}</label>
        <div class="progress-bar">
            <div id="progressFill" style="width: 0%;"></div>
        </div>
        <span id="progressText">0%</span>
    </div>
    <div class="status-container">
        <label data-i18n="compress_status">{{ _("compress_status") }}</label>
        <div id="progressStatus" data-i18n="status_waiting">Ожидание...</div>
    </div>
</div>
