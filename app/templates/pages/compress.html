<link rel="stylesheet" href="/static/css/pages/compress.css">
<h1>{{ _("compress_title") }}</h1>
<div class="compress-form">
    <!-- Поле выбора папки -->
    <div class="form-group">
        <label for="folderPath">{{ _("compress_select_folder") }}</label>
        <div class="folder-selector">
            <input type="text" id="folderPath" data-persist placeholder="C:/path/to/build" class="text-input">
            <button id="selectFolderBtn"><i class="fas fa-folder-open"></i> Выбрать</button>
        </div>
    </div>

    <!-- Имя HTML-файла -->
    <div class="form-group">
        <label for="htmlFileName">{{ _("compress_html_name") }}</label>
        <div class="folder-selector">
            <input type="text" id="htmlFileName" data-persist value="index" placeholder="{{ _('compress_html_placeholder') }}" class="text-input">
            <button id="selectHtmlBtn"><i class="fas fa-file-code"></i> Выбрать HTML</button>
        </div>
    </div>

    <!-- Блок статуса файлов -->
    <div class="file-status" id="fileStatus">
        <label>Состав проекта:</label>
        <div class="status-row">
            <div class="status-item" id="status-js">
                <i class="fas fa-circle" style="color: gray;"></i> <span>JS</span>
            </div>
            <div class="status-item" id="status-wasm">
                <i class="fas fa-circle" style="color: gray;"></i> <span>WASM</span>
            </div>
            <div class="status-item" id="status-pck">
                <i class="fas fa-circle" style="color: gray;"></i> <span>PCK</span>
            </div>
            <div class="status-item" id="status-html">
                <i class="fas fa-circle" style="color: gray;"></i> <span>HTML</span>
            </div>
        </div>
    </div>

    <!-- Блок выбора сжатия -->
    <div class="collapsible-block compression-block">
        <div class="collapsible-header compression-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label for="compressionSelect" style="margin: 0; font-weight: 500; white-space: nowrap;">Тип сжатия:</label>
                <select id="compressionSelect" class="text-input" style="width: auto; min-width: 120px; padding: 6px 10px;">
                    <option value="gzip">Gzip</option>
                    <option value="brotli">Brotli</option>
                </select>
            </div>
            <button id="toggleCompressionBlock" class="toggle-btn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div id="compressionContent" class="collapsible-content open">
            <div id="gzip-settings" class="tab-settings">
                {% include "partials/gzip_settings.html" %}
            </div>
            <div id="brotli-settings" class="tab-settings" style="display: none;">
                {% include "partials/brotli_settings.html" %}
            </div>
        </div>
    </div>

    <!-- Платформа -->
    <div class="platform-block">
        <label for="platformSelect">Платформа:</label>
        <select id="platformSelect" class="text-input">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <!-- Блок исключения расширений -->
    <div class="collapsible-block exclude-extensions">
        <div class="collapsible-header exclude-header">
            <label>
                <input type="checkbox" id="excludeEnabled" checked> 
                <span>Упаковать в архив</span>
            </label>
            <button id="toggleExcludeBlock" class="toggle-btn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>
        <div id="excludeContent" class="collapsible-content open">
            <div class="extension-input-group">
                <input type="text" id="excludeExtensionInput" placeholder=".backup">
                <button id="addExtensionBtn" class="secondary-btn">Добавить</button>
            </div>
            <ul id="extensionList" class="extension-list"></ul>
            <button id="removeSelectedExtensionsBtn" class="danger-btn">Удалить выбранное</button>
        </div>
    </div>

    <!-- Кнопка запуска -->
    <div class="form-group">
        <button id="startCompressBtn" class="primary-btn">
            <i class="fas fa-play"></i> {{ _("compress_start") }}
        </button>
    </div>

    <!-- Прогресс и статус -->
    <div class="progress-container">
        <label>{{ _("compress_progress") }}</label>
        <div class="progress-bar">
            <div id="progressFill" style="width: 0%;"></div>
        </div>
        <span id="progressText">0%</span>
    </div>
    <div class="status-container">
        <label>{{ _("compress_status") }}</label>
        <div id="progressStatus">Ожидание...</div>
    </div>
</div>
