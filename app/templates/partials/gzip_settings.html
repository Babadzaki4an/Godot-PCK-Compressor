<div id="gzip-settings" class="tab-settings">
    <h3>Gzip</h3>
    <div class="form-group">
        <label>
            <input type="checkbox" id="gzip-createBackup" checked> <span data-i18n="gzip_create_backups">Создавать бэкапы (.backup) перед изменениями</span>
        </label>
    </div>
    <div class="form-group" style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div>
            <label for="gzip-wasmLevel" data-i18n="gzip_wasm_level">Сжатие WASM (0-9):</label>
            <input type="number" id="gzip-wasmLevel" class="text-input" min="0" max="9" value="9" style="width: 70px;">
        </div>
        <div>
            <label for="gzip-pckLevel" data-i18n="gzip_pck_level">Сжатие PCK (0-9):</label>
            <input type="number" id="gzip-pckLevel" class="text-input" min="0" max="9" value="9" style="width: 70px;">
        </div>
    </div>
</div>
